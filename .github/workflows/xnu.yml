name: xnu

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/xnu.yml"

jobs:
  kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl xz-utils make clang perl python3 m4 autoconf automake gawk rsync dpkg flex bison

      - name: Build patched XNU kernel
        run: ./tools/xnu-local-build --label main

      - name: Collect kernel artifact
        run: |
          mkdir -p out
          cp ~/pixelios-artifacts/localbuild/out/main/kernel.development.sweet out/
          (cd out && sha256sum kernel.development.sweet > SHA256SUMS)
          cp -R THIRD_PARTY.md LICENSES xnu/patches/NOTICE.md out/

      - uses: actions/upload-artifact@v4
        with:
          name: xnu-kernel
          path: out/
